	<script>

		function boucle(iPeriode, fnCbTraitement, fnCbContinuer) {
			// Objectif : déclencher un appel à la fonction fnCbTraitement
			// toutes les iPeriode secondes, 
			// tant que fnCbContinuer renvoie vrai

			var rep = function () {
				if ((fnCbContinuer == undefined) || fnCbContinuer()) {

					// (fnCbContinuer == undefined) || fnCbContinuer() et non
					//  fnCbContinuer() || (fnCbContinuer == undefined)
					// car javascript évalue de la gauche vers la droite 
					// dans le second cas il teste d'abord fnCbContinuer() qui renvoie une erreur disant que
					// fnCbContinuer()  n'est pas une fonction donc une erreur se produit avant
					// d'atteindre  (fnCbContinuer == undefined)
					// avec || et &&, il faut toujours placé la condition de sécurité en premier

					fnCbTraitement();
					window.setTimeout(rep, iPeriode * 1000);
					// * 1000 pour faire la conversion en seconde
					// dans iPeriode * 1000 seconde exécute rep
				}
			}

			rep(); // est une closure

			// fnCbTraitement est une fonction de rappel ("CALLBACK")
			// elle sera appelée plus tard
			// pour l'appeler, il suffit d'ajouter les parenthèses !

			// rendre le 3ème argument optionnel
		}

		// comment faire si on décide de rendre plusieurs arguments optionnels ?

		// On peut passer par les objets 
		// un objet est une association nom: valeur - cela empêche les ambiguités

		objectDefault = {
			periode: 5,
			traiter: function () { trace("traitement") },
			continuer: function () { return true; }
		}

		function enrichir(objectDefault, objectModif) {
			// renvoie un nouvel objet ayant complété les propriétés absentes de l'objet de configuration
			// par les valeurs de l'objet par défaut

			var objectFinal = {};

			for (nomProp in objectDefault) {
				if (objectModif[nomProp] != undefined)
					objectFinal[nomProp] = objectModif[nomProp];
				else
					objectFinal[nomProp] = objectDefault[nomProp];
			}

			return objectFinal;
		}

		function boucleV2(objectConfig) {
			// traiter les paramètres effectifs

			/*
			var objectReel = objectDefault;  
			// ceci n'est pas une copie, c'est une prise de référence !! 
			// qui revient à donner un second nom à l'espace mémoire objectDefault
			// pour les objets, = ne duplique rien: il crée un second nom
			// pour le meme objet en mémoire
			
			// on voudrait faire un clonage 
			// il existe deux types de copies pour les objets:
			// superficielle (shallow copy) et profonde (deep copy).
			// const clone = Object.assign({}, original);
			// superficiel 
			// const clone = JSON.parse(JSON.stringify(original));
			// superficiel 
			// ne fonctionne pas avec les méthodes 
			
			// jQuery propose une méthode de clonage profond 
			
			if (oConfig.periode != undefined) objectReel.periode = oConfig.periode; 
			if (oConfig.traiter != undefined) objectReel.traiter = oConfig.traiter; 
			if (oConfig.continuer != undefined) objectReel.continuer = oConfig.continuer; 
			
			*/

			var objectReel = enrichir(objectDefault, objectConfig);

			// boucle utilisant les arguments
			var rep = function () {
				if (objectReel.continuer()) {
					objectReel.traiter();
					window.setTimeout(rep, objectReel.periode * 1000);
				}
			}
			rep();

		}
